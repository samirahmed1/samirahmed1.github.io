<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090c" />
  <meta name="description" content="4SGamz — independent Android games including Truck On Fire, My Mini Shop Simulator, The Throw and more." />
  <meta name="robots" content="index,follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="4SGamz | Indie Android Games" />
  <meta property="og:description" content="Discover 4SGamz Android games — simulation, action, casual and arcade experiences built independently." />
  <meta property="og:url" content="https://samirahmed1.github.io/" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>4SGamz | Indie Android Games</title>

  <style>
    :root {
      --bg: #07080b;
      --bg-2: #0b0d12;
      --card: rgba(17, 19, 25, 0.82);
      --card-solid: #111319;
      --surface: #171a22;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(159, 135, 255, 0.38);
      --text: #f6f7fb;
      --muted: #9da2af;
      --muted-2: #727887;
      --accent: #927cff;
      --accent-2: #5f8dff;
      --good: #7ee2ad;
      --warning: #ffd477;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(119, 87, 255, 0.16), transparent 31rem),
        radial-gradient(circle at 88% 20%, rgba(55, 118, 255, 0.12), transparent 30rem),
        linear-gradient(180deg, #090a0f 0%, var(--bg) 36%, #08090c 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, #000 0, transparent 75%);
    }

    a { color: inherit; }
    button, input { font: inherit; }
    button { color: inherit; }
    img { display: block; max-width: 100%; }

    .shell {
      width: min(var(--max), calc(100% - 40px));
      margin-inline: auto;
    }

    /* NAV */
    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 0;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: linear-gradient(to bottom, rgba(7, 8, 11, .88), rgba(7, 8, 11, .55));
      border-bottom: 1px solid rgba(255,255,255,.055);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      font-weight: 850;
      font-size: 22px;
      letter-spacing: -0.7px;
    }

    .brand-mark {
      width: 38px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--accent), #6647ff);
      box-shadow: 0 8px 28px rgba(123, 92, 255, .28), inset 0 1px 0 rgba(255,255,255,.32);
      font-size: 16px;
    }

    .brand span span { color: #9d8bff; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link,
    .nav-cta {
      text-decoration: none;
      border-radius: 12px;
      padding: 10px 13px;
      color: #b8bdc9;
      font-size: 14px;
      font-weight: 650;
      transition: .2s ease;
    }

    .nav-link:hover { color: white; background: rgba(255,255,255,.055); }

    .nav-cta {
      color: #0a0b0f;
      background: white;
      padding-inline: 15px;
    }
    .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,255,255,.12); }

    /* HERO */
    .hero {
      padding: clamp(62px, 8vw, 110px) 0 60px;
      position: relative;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(360px, .95fr);
      align-items: center;
      gap: clamp(42px, 7vw, 86px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #c7c1f9;
      background: rgba(146, 124, 255, .10);
      border: 1px solid rgba(146,124,255,.22);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 0 5px rgba(126, 226, 173, .08);
    }

    h1 {
      font-size: clamp(46px, 7.2vw, 88px);
      line-height: .96;
      letter-spacing: clamp(-4px, -0.45vw, -1.8px);
      max-width: 780px;
    }

    .gradient-text {
      color: transparent;
      background: linear-gradient(95deg, #c5baff, #8ca7ff 48%, #72d3d0);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .hero-copy {
      margin-top: 24px;
      max-width: 650px;
      color: #aeb3bf;
      font-size: clamp(16px, 1.7vw, 19px);
      line-height: 1.72;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      margin-top: 30px;
    }

    .btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      text-decoration: none;
      font-weight: 750;
      font-size: 14px;
      cursor: pointer;
      background: rgba(255,255,255,.045);
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .btn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.075); }
    .btn-primary { background: white; color: #090a0e; border-color: white; }
    .btn-primary:hover { background: #efeff5; }

    .btn-primary::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-130%) skewX(-18deg);
      background: linear-gradient(90deg, transparent, rgba(146,124,255,.22), transparent);
      animation: shine 5.6s ease-in-out infinite;
    }

    @keyframes shine {
      0%, 68% { transform: translateX(-130%) skewX(-18deg); }
      86%, 100% { transform: translateX(130%) skewX(-18deg); }
    }

    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 22px;
      margin-top: 34px;
      color: var(--muted);
    }

    .hero-stat strong {
      display: block;
      color: white;
      font-size: 23px;
      letter-spacing: -.6px;
      margin-bottom: 2px;
    }

    .hero-stat span { font-size: 12px; text-transform: uppercase; letter-spacing: .9px; }

    .featured-visual {
      position: relative;
      min-height: 470px;
    }

    .featured-card {
      position: absolute;
      inset: 18px 0 18px 25px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 32px;
      background: #12141a;
      box-shadow: var(--shadow);
      transform: rotate(2.2deg);
      transition: transform .45s cubic-bezier(.2,.8,.2,1);
    }

    .featured-card:hover { transform: rotate(.4deg) translateY(-5px); }

    .featured-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(8,9,13,.97) 2%, rgba(8,9,13,.35) 52%, rgba(8,9,13,.06) 100%);
    }

    .featured-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .featured-content {
      position: absolute;
      z-index: 2;
      left: 28px;
      right: 28px;
      bottom: 28px;
    }

    .featured-label {
      color: #c9c2fb;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin-bottom: 9px;
    }

    .featured-title {
      font-size: clamp(26px, 3vw, 38px);
      line-height: 1.05;
      letter-spacing: -1.5px;
      margin-bottom: 9px;
    }

    .featured-meta {
      color: #bdc0c9;
      font-size: 14px;
    }

    .floating-icon {
      position: absolute;
      z-index: 4;
      width: 92px;
      border-radius: 24px;
      border: 5px solid #0c0e13;
      box-shadow: 0 18px 44px rgba(0,0,0,.42);
      left: -12px;
      top: 0;
      transform: rotate(-7deg);
      animation: floaty 5s ease-in-out infinite;
    }

    @keyframes floaty {
      0%,100% { transform: rotate(-7deg) translateY(0); }
      50% { transform: rotate(-4deg) translateY(-8px); }
    }

    /* SECTION */
    .section {
      padding: 42px 0 92px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 25px;
    }

    .section-kicker {
      color: #9c8df4;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin-bottom: 7px;
    }

    .section-title {
      font-size: clamp(30px, 4vw, 48px);
      letter-spacing: -1.8px;
      line-height: 1.05;
    }

    .section-sub {
      color: var(--muted);
      max-width: 580px;
      line-height: 1.6;
      margin-top: 10px;
      font-size: 15px;
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 24px 0 24px;
      flex-wrap: wrap;
    }

    .search {
      flex: 1 1 260px;
      min-width: 0;
      height: 46px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      color: white;
      outline: none;
      padding: 0 15px;
      transition: .2s ease;
    }

    .search:focus { border-color: rgba(146,124,255,.55); box-shadow: 0 0 0 4px rgba(146,124,255,.08); }
    .search::placeholder { color: #666d7a; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      color: #aeb3bf;
      border-radius: 999px;
      min-height: 40px;
      padding: 0 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      color: white;
      border-color: rgba(146,124,255,.38);
      background: rgba(146,124,255,.12);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .game-card {
      position: relative;
      overflow: hidden;
      min-width: 0;
      border-radius: var(--radius-lg);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 10px 32px rgba(0,0,0,.14);
      /* Per-card backdrop blur is expensive on mobile. The layered card
         backgrounds below preserve the same glassy depth much more cheaply. */
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      transition: transform .28s cubic-bezier(.2,.8,.2,1), border-color .28s ease, box-shadow .28s ease;
      opacity: 0;
      transform: translateY(14px);
    }

    .game-card.visible { opacity: 1; transform: translateY(0); }
    .game-card:hover {
      transform: translateY(-7px);
      border-color: var(--border-strong);
      box-shadow: 0 24px 65px rgba(0,0,0,.28), 0 0 0 1px rgba(146,124,255,.06);
    }

    .game-cover {
      position: relative;
      aspect-ratio: 16 / 8.9;
      overflow: visible;
      background: #101218;
    }

    .game-cover > img:first-child {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: none;
      transition: filter .22s ease;
    }

    /* Keep the image completely still; only a tiny color lift on desktop hover. */
    .game-card:hover .game-cover > img { transform: none; filter: saturate(1.05); }

    .game-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(11,13,18,.8), transparent 55%);
      pointer-events: none;
    }

    .game-icon {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: auto;
      width: 96px;
      height: 96px;
      transform: translate(-50%, -50%);
      border-radius: 16px;
      border-width: 3px;
      
      box-shadow: 0 10px 26px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.06);
    }

    .status-pill {
      position: absolute;
      z-index: 3;
      right: 12px;
      top: 12px;
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(8,9,13,.74);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(10px);
      font-size: 11px;
      font-weight: 800;
      color: #d8dbe4;
    }

    .status-pill.pre { color: #c8bfff; border-color: rgba(146,124,255,.27); }

    .game-body { padding: 18px; }

    .game-title-row {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
    }

    .game-title {
      font-size: 19px;
      line-height: 1.22;
      letter-spacing: -.45px;
      font-weight: 800;
    }

    .game-category {
      color: #a899f7;
      font-size: 12px;
      font-weight: 750;
      margin-top: 5px;
    }

    .rating {
      white-space: nowrap;
      color: #f5d170;
      font-size: 13px;
      font-weight: 800;
      padding-top: 2px;
    }

    .game-description {
      color: #9ea4b1;
      line-height: 1.58;
      font-size: 14px;
      margin: 14px 0 15px;
      min-height: 66px;
    }

    .meta-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 15px;
    }

    .meta {
      min-width: 0;
      padding: 9px 8px;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 11px;
      background: rgba(255,255,255,.025);
    }

    .meta-label {
      color: #696f7c;
      text-transform: uppercase;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .8px;
    }

    .meta-value {
      color: #d4d7df;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 720;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .card-actions .btn { min-height: 42px; padding-inline: 13px; border-radius: 11px; }

    .empty {
      display: none;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 20px;
      padding: 46px 20px;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    /* ABOUT */
    .about-card {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 44px;
      padding: clamp(28px, 5vw, 54px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(146,124,255,.09), rgba(255,255,255,.025) 45%, rgba(95,141,255,.055));
      box-shadow: var(--shadow);
    }

    .about-card::before {
      content: "4S";
      position: absolute;
      right: -22px;
      bottom: -76px;
      font-size: 250px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -24px;
      color: rgba(255,255,255,.018);
      pointer-events: none;
    }

    .about-number {
      color: transparent;
      background: linear-gradient(135deg, #f3efff, #9a88ff);
      -webkit-background-clip: text;
      background-clip: text;
      font-size: clamp(78px, 10vw, 142px);
      font-weight: 900;
      line-height: .82;
      letter-spacing: -8px;
    }

    .about-small { color: #7d8390; margin-top: 15px; font-size: 13px; text-transform: uppercase; font-weight: 800; letter-spacing: 1.1px; }
    .about-title { font-size: clamp(28px, 4vw, 44px); letter-spacing: -1.5px; margin-bottom: 14px; }
    .about-copy { color: #a9aeba; line-height: 1.75; max-width: 680px; }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal.open { display: grid; }

    .modal-panel {
      width: min(900px, 100%);
      max-height: min(760px, calc(100vh - 44px));
      overflow: auto;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 26px;
      background: #0f1117;
      box-shadow: 0 30px 100px rgba(0,0,0,.58);
      animation: pop .22s ease-out;
    }

    @keyframes pop { from { opacity: 0; transform: scale(.975) translateY(8px); } }

    .modal-top {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 18px;
      background: rgba(15,17,23,.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    .modal-title { font-size: 18px; font-weight: 800; }
    .close {
      width: 38px; height: 38px;
      display: grid; place-items: center;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      cursor: pointer;
    }

    .modal-content { padding: 18px; }

    .shots {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .shot {
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--border);
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #171a20;
    }

    .modal-copy { color: #acb1bd; line-height: 1.72; margin: 18px 2px 20px; }

    /* FOOTER */
    footer {
      border-top: 1px solid rgba(255,255,255,.06);
      padding: 30px 0 46px;
      color: #747a88;
      font-size: 13px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-links { display: flex; gap: 15px; flex-wrap: wrap; }
    .footer-links a { color: #9399a7; text-decoration: none; }
    .footer-links a:hover { color: white; }

    /* RESPONSIVE */
    @media (max-width: 980px) {
      .hero-grid { grid-template-columns: 1fr; }
      .featured-visual { min-height: 430px; max-width: 680px; width: 100%; margin-inline: auto; }
      .featured-card { inset: 20px 0 10px 20px; }
      .games-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .about-card { grid-template-columns: 1fr; gap: 28px; }
      .about-number { font-size: 92px; }
    }

    @media (max-width: 680px) {
      .shell { width: min(100% - 26px, var(--max)); }
      .nav-wrap { padding: 10px 0; }
      .nav-link { display: none; }
      .nav-cta { padding: 9px 12px; font-size: 12px; }
      .brand { font-size: 19px; }
      .brand-mark { width: 34px; border-radius: 10px; }

      .hero { padding-top: 52px; }
      h1 { font-size: clamp(43px, 15vw, 62px); letter-spacing: -2.8px; }
      .hero-copy { font-size: 16px; }
      .hero-actions { display: grid; grid-template-columns: 1fr; }
      .btn { width: 100%; }
      .hero-stats { justify-content: space-between; gap: 16px; }
      .hero-stat strong { font-size: 20px; }

      .featured-visual { min-height: 330px; }
      .featured-card { inset: 10px 0 5px 10px; border-radius: 24px; }
      .floating-icon { width: 70px; border-radius: 19px; left: -2px; }
      .featured-content { left: 20px; right: 20px; bottom: 20px; }

      .section { padding-bottom: 68px; }
      .section-head { align-items: start; flex-direction: column; }
      .games-grid { grid-template-columns: 1fr; }
      .filters { width: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 3px; scrollbar-width: none; }
      .filters::-webkit-scrollbar { display: none; }
      .filter-btn { flex: 0 0 auto; }
      .game-description { min-height: 0; }
      .meta-row { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .shots { grid-template-columns: 1fr; }
      .modal { padding: 10px; }
      .modal-panel { max-height: calc(100vh - 20px); border-radius: 20px; }
    }

    /* Mobile performance pass: preserve every feature, reduce paint cost. */
    @media (max-width: 680px) {
      .game-card {
        box-shadow: 0 8px 24px rgba(0,0,0,.14);
      }

      .game-card::before {
        opacity: .075;
      }

      .game-card::after {
        /* Static center glow on touch devices; the desktop torch remains live. */
        background:
          radial-gradient(320px circle at 50% 18%, rgba(154,135,255,.075), transparent 44%),
          linear-gradient(180deg, rgba(12,14,19,.03), rgba(12,14,19,.86) 52%, rgba(12,14,19,.98));
      }

      .status-pill,
      .nav-wrap {
        /* Keep glass effects only where useful; card-level blur is already gone. */
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }
    }

    @media (max-width: 390px) {

      .meta-row { grid-template-columns: 1fr 1fr; }
      .meta:last-child { grid-column: 1 / -1; }
      .card-actions { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {

       V2 — LIVELIER, MOBILE-FIRST POLISH
       ========================================================= */

    body {
      isolation: isolate;
    }

    /* Lightweight animated atmosphere: transforms only = GPU friendly */
    .ambient {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -2;
    }

    .ambient-orb {
      position: absolute;
      width: clamp(220px, 30vw, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      /* The radial gradient is already soft; avoiding filter:blur saves a lot
         of GPU work on phones while keeping the same moving atmosphere. */
      filter: none;
      opacity: .13;
      will-change: transform;
      background: radial-gradient(circle, rgba(146,124,255,.46) 0%, rgba(95,141,255,.16) 42%, rgba(95,141,255,.06) 58%, transparent 74%);
      animation: drift-orb 15s ease-in-out infinite alternate;
    }

    .ambient-orb:nth-child(1) { left: -9%; top: 12%; }
    .ambient-orb:nth-child(2) {
      right: -10%;
      top: 42%;
      animation-duration: 19s;
      animation-direction: alternate-reverse;
      background: radial-gradient(circle, rgba(54,216,201,.30) 0%, rgba(73,104,255,.11) 46%, rgba(73,104,255,.04) 60%, transparent 74%);
    }
    .ambient-orb:nth-child(3) {
      left: 34%;
      bottom: -20%;
      width: clamp(260px, 38vw, 620px);
      opacity: .09;
      animation-duration: 22s;
    }

    @keyframes drift-orb {
      from { transform: translate3d(-18px,-12px,0) scale(.96); }
      to   { transform: translate3d(28px,30px,0) scale(1.08); }
    }

    .brand-mark {
      position: relative;
      overflow: hidden;
      animation: brand-breathe 4.8s ease-in-out infinite;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: -30%;
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.38), transparent 65%);
      transform: translateX(-80%) rotate(16deg);
      animation: brand-shine 5.4s ease-in-out infinite;
    }

    @keyframes brand-breathe {
      0%,100% { box-shadow: 0 8px 28px rgba(123,92,255,.28), inset 0 1px 0 rgba(255,255,255,.32); }
      50% { box-shadow: 0 11px 34px rgba(123,92,255,.44), inset 0 1px 0 rgba(255,255,255,.38); }
    }

    @keyframes brand-shine {
      0%,62% { transform: translateX(-90%) rotate(16deg); }
      82%,100% { transform: translateX(90%) rotate(16deg); }
    }

    .eyebrow::before {
      animation: live-dot 1.8s ease-in-out infinite;
    }

    @keyframes live-dot {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 5px rgba(126,226,173,.08); }
      50% { transform: scale(1.14); box-shadow: 0 0 0 9px rgba(126,226,173,.035); }
    }

    .gradient-text {
      background-size: 180% 180%;
      animation: gradient-flow 7s ease infinite;
    }

    @keyframes gradient-flow {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .featured-card {
      animation: featured-float 7s ease-in-out infinite;
    }

    .featured-image {
      animation: featured-pan 16s ease-in-out infinite alternate;
      transform: scale(1.035);
      will-change: transform;
    }

    @keyframes featured-float {
      0%,100% { translate: 0 0; }
      50% { translate: 0 -7px; }
    }

    @keyframes featured-pan {
      from { transform: scale(1.035) translate3d(-.6%, 0, 0); }
      to { transform: scale(1.075) translate3d(.8%, -.4%, 0); }
    }

    /* Make game cards feel like little living game windows */
    .game-card {
